user  root;
worker_processes  1;

events {
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen       80;

        location / {
            proxy_pass http://frontend-ol:3000/;
        }
    }
}